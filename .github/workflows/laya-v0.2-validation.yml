name: LayaAir V0.2 tech validation

on:
  push:
    branches: ["laya-v0.2-tech-validation"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-laya:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install LayaAir CLI 3.4.0
        run: |
          curl -fsSL https://raw.githubusercontent.com/layabox/layaair-cli/master/install.sh | bash
          ~/.layaair/layaair install 3.4.0
          ~/.layaair/layaair --version

      - name: Create official 2D empty project
        run: |
          if [ ! -f "LayaXiangAI/LayaXiangAI.laya" ]; then
            ~/.layaair/layaair --version=3.4.0 create LayaXiangAI \
              -p "$GITHUB_WORKSPACE" \
              -s \
              -t "2D empty project"
          fi
          echo "=== Project files ==="
          find LayaXiangAI -maxdepth 4 -type f | sort | sed -n '1,260p'

      - name: Validate project
        run: |
          ~/.layaair/layaair --version=3.4.0 validate -p "$GITHUB_WORKSPACE/LayaXiangAI"

      - name: Build Web
        run: |
          ~/.layaair/layaair --version=3.4.0 build web -p "$GITHUB_WORKSPACE/LayaXiangAI"

      - name: Chromium code-first smoke test
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE/LayaXiangAI/release/web" >/tmp/laya-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, executablePath: '/usr/bin/google-chrome' });
            const page = await browser.newPage({ viewport: { width: 540, height: 960 } });
            const errors = [];
            page.on('pageerror', e => errors.push('pageerror: ' + e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push('console: ' + m.text()); });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForFunction(() => window.__LAYA_PROBE__?.ok === true, null, { timeout: 20000 });
            const state = await page.evaluate(() => ({
              probe: window.__LAYA_PROBE__,
              canvas: !!document.querySelector('canvas')
            }));
            console.log('LAYA_CODE_FIRST_STATE', JSON.stringify(state));
            if (!state.canvas) throw new Error('Laya canvas missing');
            if (errors.length) throw new Error(errors.join('\n'));
            await browser.close();
            console.log('LAYA_CODE_FIRST_OK');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Commit official template to validation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LayaXiangAI
          if ! git diff --cached --quiet; then
            git commit -m "chore: bootstrap LayaAir 3.4 2D project"
            git push origin HEAD:laya-v0.2-tech-validation
          fi

      - name: Upload generated project and Web build
        uses: actions/upload-artifact@v4
        with:
          name: laya-v0.2-bootstrap
          path: |
            LayaXiangAI
          if-no-files-found: error
