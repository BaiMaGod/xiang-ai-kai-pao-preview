name: LayaAir V0.2 tech validation

on:
  push:
    branches: ["laya-v0.2-tech-validation"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-laya:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install LayaAir CLI 3.4.0
        run: |
          curl -fsSL https://raw.githubusercontent.com/layabox/layaair-cli/master/install.sh | bash
          ~/.layaair/layaair install 3.4.0
          ~/.layaair/layaair --version

      - name: Create official 2D empty project
        run: |
          if [ ! -f "LayaXiangAI/LayaXiangAI.laya" ]; then
            ~/.layaair/layaair --version=3.4.0 create LayaXiangAI \
              -p "$GITHUB_WORKSPACE" \
              -s \
              -t "2D empty project"
          fi

      - name: Validate project
        run: |
          ~/.layaair/layaair --version=3.4.0 validate -p "$GITHUB_WORKSPACE/LayaXiangAI"

      - name: Build Web
        run: |
          ~/.layaair/layaair --version=3.4.0 build web -p "$GITHUB_WORKSPACE/LayaXiangAI"

      - name: Chromium gameplay smoke test
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE/LayaXiangAI/release/web" >/tmp/laya-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, executablePath: '/usr/bin/google-chrome' });
            const page = await browser.newPage({ viewport: { width: 540, height: 960 } });
            const errors = [];
            page.on('pageerror', e => errors.push('pageerror: ' + e.message));
            page.on('console', m => {
              if (m.type() === 'error' && !m.text().includes('Failed to load resource')) {
                errors.push('console: ' + m.text());
              }
            });
            await page.goto('http://127.0.0.1:4173/?fast=1', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForFunction(() => window.__XIANG_AI_LAYA__?.ready === true, null, { timeout: 20000 });
            const x0 = await page.evaluate(() => window.__XIANG_AI_LAYA__.playerX);
            await page.keyboard.down('d');
            await page.waitForTimeout(450);
            await page.keyboard.up('d');
            await page.waitForFunction(
              () => window.__XIANG_AI_LAYA__?.aiAnalyzed &&
                    window.__XIANG_AI_LAYA__?.shieldSpawned >= 2 &&
                    window.__XIANG_AI_LAYA__?.emergencyUpgrade === 'AP' &&
                    window.__XIANG_AI_LAYA__?.shots > 0 &&
                    window.__XIANG_AI_LAYA__?.xpCollected > 0 &&
                    window.__XIANG_AI_LAYA__?.level >= 2,
              null,
              { timeout: 12000 }
            );

            for (let i = 0; i < 20; i++) {
              await page.waitForTimeout(750);
              const dbg = await page.evaluate(() => ({ ...window.__XIANG_AI_LAYA__ }));
              if (i % 2 === 0) console.log('BOSS_DEBUG', JSON.stringify(dbg));
              if (dbg.bossDefeated && dbg.victory) break;
            }

            const state = await page.evaluate(() => ({
              game: window.__XIANG_AI_LAYA__,
              canvas: !!document.querySelector('canvas')
            }));
            console.log('XIANG_AI_LAYA_STATE', JSON.stringify(state));
            if (!state.canvas) throw new Error('Laya canvas missing');
            if (state.game.playerX <= x0 + 2) throw new Error('Keyboard movement failed');
            if (!state.game.aiAnalyzed) throw new Error('AI analysis did not trigger');
            if (state.game.shieldSpawned < 2) throw new Error('Shield counter enemies did not spawn');
            if (state.game.emergencyUpgrade !== 'AP') throw new Error('Emergency protocol did not resolve');
            if (state.game.shots <= 0) throw new Error('Auto-fire did not run');
            if (state.game.xpCollected <= 0) throw new Error('XP pickup loop did not run');
            if (state.game.level < 2) throw new Error('Roguelike level-up loop did not run');
            if (!state.game.bossDefeated) throw new Error('GPT-0 boss was not defeated');
            if (!state.game.victory) throw new Error('Victory flow did not complete');
            if (errors.length) throw new Error(errors.join('\n'));
            await page.screenshot({ path: 'laya-v0.2-smoke.png', fullPage: true });
            await browser.close();
            console.log('XIANG_AI_LAYA_SMOKE_OK');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Commit official template updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LayaXiangAI
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh LayaAir generated project"
            git push origin HEAD:laya-v0.2-tech-validation
          fi

      - name: Publish Laya Web build into public preview
        run: |
          git fetch origin main
          rm -rf /tmp/preview-main
          git worktree add /tmp/preview-main origin/main
          cd /tmp/preview-main
          rm -rf laya-v0.2
          mkdir -p laya-v0.2
          cp -a "$GITHUB_WORKSPACE/LayaXiangAI/release/web/." laya-v0.2/
          touch laya-v0.2/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laya-v0.2
          if ! git diff --cached --quiet; then
            git commit -m "preview: publish LayaAir V0.2 build"
            git push origin HEAD:main
          fi

      - name: Upload Web build and smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: laya-v0.2-tech-validation
          path: |
            LayaXiangAI
            laya-v0.2-smoke.png
          if-no-files-found: error
