name: Deploy preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  browser-smoke:
    name: Chromium live preview smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Open live Pages and click Start
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
            const errors = [];

            page.on('pageerror', err => errors.push('pageerror: ' + err.message));
            page.on('console', msg => {
              if (msg.type() === 'error') errors.push('console: ' + msg.text());
            });

            const base = process.env.PREVIEW_URL.replace(/\/$/, '');
            const url = base + '/?test=1';
            console.log('Opening:', url);

            await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForSelector('#start-btn', { state: 'visible', timeout: 15000 });

            const before = await page.evaluate(() => ({
              render: document.body.dataset.render || null,
              error: document.body.dataset.error || null,
              startHidden: document.getElementById('start-screen')?.classList.contains('hidden')
            }));
            console.log('Before click:', before);

            await page.click('#start-btn');

            await page.waitForFunction(() => {
              const start = document.getElementById('start-screen');
              const hud = document.getElementById('hud');
              return start?.classList.contains('hidden') && !hud?.classList.contains('hidden');
            }, null, { timeout: 15000 });

            // Force the debug fast-forward so smoke testing does not depend on
            // headless WebGL frame-rate / timer throttling.
            await page.keyboard.press('Digit2');

            await page.waitForFunction(
              () => window.__GAME_TEST__?.state?.()?.ai === true,
              null,
              { timeout: 15000 }
            );

            await page.waitForFunction(
              () => Boolean(window.__GAME_TEST__?.state?.()?.counter),
              null,
              { timeout: 15000 }
            );

            const state = await page.evaluate(() => ({
              render: document.body.dataset.render || null,
              error: document.body.dataset.error || null,
              testStatus: document.body.dataset.testStatus || null,
              game: window.__GAME_TEST__?.state?.() || null,
              startHidden: document.getElementById('start-screen')?.classList.contains('hidden'),
              hudHidden: document.getElementById('hud')?.classList.contains('hidden')
            }));
            console.log('After click:', JSON.stringify(state, null, 2));

            if (state.render !== 'ok') throw new Error('Three.js game did not initialize');
            if (!state.startHidden || state.hudHidden) throw new Error('Start button did not enter gameplay');
            if (state.error) throw new Error('Runtime error: ' + state.error);
            if (!state.game?.ai) throw new Error('Test mode did not reach AI analysis');
            if (!state.game?.counter) throw new Error('Test mode did not auto-select AI counter');
            if (errors.length) throw new Error('Browser errors:\n' + errors.join('\n'));

            await browser.close();
            console.log('LIVE_BROWSER_SMOKE_OK');
          })().catch(async err => {
            console.error(err);
            process.exit(1);
          });
          NODE


      - name: Open live Laya V0.2 preview
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 540, height: 960 } });
            const errors = [];

            page.on('pageerror', err => errors.push('pageerror: ' + err.message));
            page.on('console', msg => {
              if (msg.type() === 'error' && !msg.text().includes('Failed to load resource')) {
                errors.push('console: ' + msg.text());
              }
            });

            const base = process.env.PREVIEW_URL.replace(/\/$/, '');

            const normalUrl = base + '/laya-v0.2/';
            console.log('Opening normal Laya preview:', normalUrl);
            await page.goto(normalUrl, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForFunction(
              () => window.__XIANG_AI_LAYA__?.ready === true &&
                    window.__XIANG_AI_LAYA__?.startScreen === true,
              null,
              { timeout: 20000 }
            );
            await page.waitForSelector('#start-game-dom', { state: 'visible', timeout: 5000 });
            await page.locator('#start-game-dom').click();
            await page.waitForFunction(
              () => window.__XIANG_AI_LAYA__?.running === true &&
                    window.__XIANG_AI_LAYA__?.startScreen === false,
              null,
              { timeout: 5000 }
            );

            await page.evaluate(() => window.__XIANG_AI_LAYA__.testOpenLevelUp());
            await page.waitForSelector('#game-choice-modal[data-modal-type="LEVEL_UP"]', { state: 'visible', timeout: 5000 });
            const cards = page.locator('#game-choice-modal .game-choice-button');
            if (await cards.count() !== 3) throw new Error('Live Laya upgrade modal did not show 3 choices');
            const firstChoice = await cards.first().getAttribute('data-choice-id');
            await cards.first().click();
            await page.waitForFunction(
              () => !document.querySelector('#game-choice-modal') &&
                    window.__XIANG_AI_LAYA__?.lastChoice,
              null,
              { timeout: 5000 }
            );
            const clickedChoice = await page.evaluate(() => window.__XIANG_AI_LAYA__.lastChoice);
            if (clickedChoice !== firstChoice) throw new Error('Live Laya upgrade choice did not apply');
            console.log('LIVE_LAYA_UPGRADE_CHOICE_OK', JSON.stringify({ firstChoice, clickedChoice }));

            const url = base + '/laya-v0.2/?fast=1';
            console.log('Opening fast Laya preview:', url);
            await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForFunction(
              () => window.__XIANG_AI_LAYA__?.ready === true,
              null,
              { timeout: 20000 }
            );

            const initial = await page.evaluate(() => ({
              playerX: window.__XIANG_AI_LAYA__.playerX,
              cameraX: window.__XIANG_AI_LAYA__.cameraX
            }));
            await page.keyboard.down('d');
            await page.waitForTimeout(900);
            await page.keyboard.up('d');

            await page.waitForFunction(
              () => window.__XIANG_AI_LAYA__?.bossDefeated === true &&
                    window.__XIANG_AI_LAYA__?.victory === true,
              null,
              { timeout: 35000 }
            );

            const state = await page.evaluate(() => ({
              game: window.__XIANG_AI_LAYA__,
              canvas: !!document.querySelector('canvas')
            }));
            console.log('Laya live state:', JSON.stringify(state, null, 2));

            if (!state.canvas) throw new Error('Laya canvas missing');
            if (state.game.playerX <= initial.playerX + 2) throw new Error('Laya movement failed');
            if (!state.game.largeWorldCamera) throw new Error('Live large world camera is not active');
            if (state.game.worldWidth < 1800 || state.game.worldHeight < 1800) throw new Error('Live world is not large enough');
            if (state.game.cameraX <= initial.cameraX + 12) throw new Error('Live horizontal camera follow did not activate');
            if (state.game.playerScreenX > state.game.cameraDeadZone.right + 40) throw new Error('Live player escaped camera dead zone');
            if (state.game.shots <= 0) throw new Error('Laya auto-fire failed');
            if (!state.game.frameClipAnimation) throw new Error('Live frame clip animation system is not active');
            if (!state.game.playerFrameClipReady) throw new Error('Live player run clips are not ready');
            if (state.game.frameAnimatedEnemies <= 0) throw new Error('Live enemy frame clips are not active');
            if (state.game.artLoadFailures?.length) throw new Error('Live art preload failures: ' + state.game.artLoadFailures.join(','));
            if (!state.game.bossDefeated || !state.game.victory) throw new Error('Laya GPT-0 victory flow failed');

            await page.waitForSelector('#game-choice-modal[data-modal-type="VICTORY"]', { state: 'visible', timeout: 5000 });
            const victoryButtons = page.locator('#game-choice-modal .game-choice-button');
            if (await victoryButtons.count() !== 1) throw new Error('Live victory screen must expose one restart action');
            await victoryButtons.first().click();

            await page.waitForFunction(
              () => window.__XIANG_AI_LAYA__?.running === true &&
                    window.__XIANG_AI_LAYA__?.victory === false &&
                    window.__XIANG_AI_LAYA__?.bossDefeated === false &&
                    window.__XIANG_AI_LAYA__?.level === 1 &&
                    window.__XIANG_AI_LAYA__?.kills === 0 &&
                    !document.querySelector('#game-choice-modal'),
              null,
              { timeout: 5000 }
            );

            const restarted = await page.evaluate(() => ({
              level: window.__XIANG_AI_LAYA__.level,
              kills: window.__XIANG_AI_LAYA__.kills,
              victory: window.__XIANG_AI_LAYA__.victory,
              bossDefeated: window.__XIANG_AI_LAYA__.bossDefeated,
              running: window.__XIANG_AI_LAYA__.running
            }));
            console.log('LIVE_LAYA_VICTORY_RESTART_OK', JSON.stringify(restarted));

            if (errors.length) throw new Error('Laya browser errors:\n' + errors.join('\n'));

            await browser.close();
            console.log('LIVE_LAYA_V0_2_SMOKE_OK');
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
