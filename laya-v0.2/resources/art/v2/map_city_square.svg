<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2200" viewBox="0 0 2200 2200">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07131f"/><stop offset=".55" stop-color="#0a1826"/><stop offset="1" stop-color="#06111b"/>
  </linearGradient>
  <pattern id="tiles" width="72" height="72" patternUnits="userSpaceOnUse">
    <rect width="72" height="72" fill="#0b1926"/>
    <path d="M72 0H0V72" fill="none" stroke="#153048" stroke-width="2" opacity=".55"/>
  </pattern>
  <pattern id="roadDashV" width="16" height="104" patternUnits="userSpaceOnUse">
    <rect x="6" y="18" width="4" height="42" rx="2" fill="#66869b" opacity=".8"/>
  </pattern>
  <pattern id="roadDashH" width="104" height="16" patternUnits="userSpaceOnUse">
    <rect x="18" y="6" width="42" height="4" rx="2" fill="#66869b" opacity=".8"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="2200" height="2200" fill="url(#bg)"/>
<rect width="2200" height="2200" fill="url(#tiles)" opacity=".92"/>

<!-- road network -->
<g fill="#0b1722" stroke="#2c4658" stroke-width="8">
  <rect x="285" y="0" width="190" height="2200"/>
  <rect x="1005" y="0" width="190" height="2200"/>
  <rect x="1725" y="0" width="190" height="2200"/>
  <rect x="0" y="285" width="2200" height="190"/>
  <rect x="0" y="1005" width="2200" height="190"/>
  <rect x="0" y="1725" width="2200" height="190"/>
</g>
<g opacity=".75">
  <rect x="375" y="0" width="16" height="2200" fill="url(#roadDashV)"/>
  <rect x="1095" y="0" width="16" height="2200" fill="url(#roadDashV)"/>
  <rect x="1815" y="0" width="16" height="2200" fill="url(#roadDashV)"/>
  <rect x="0" y="375" width="2200" height="16" fill="url(#roadDashH)"/>
  <rect x="0" y="1095" width="2200" height="16" fill="url(#roadDashH)"/>
  <rect x="0" y="1815" width="2200" height="16" fill="url(#roadDashH)"/>
</g>

<!-- cyan curb lighting -->
<g stroke="#22d9ff" stroke-width="8" opacity=".72" filter="url(#glow)" fill="none">
